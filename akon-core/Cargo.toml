[package]
edition = "2021"
name = "akon-core"
version = "1.2.3"

[features]
default = []
# Enable the mock keyring implementation and its test-only dependencies
mock-keyring = ["lazy_static"]

[lints.rust]
dead_code = "deny"

[dependencies]
# Workspace dependencies
anyhow.workspace = true
base32.workspace = true
chrono = "0.4"
data-encoding = "2.9.0"
keyring.workspace = true
nix.workspace = true
regex = "1.10"
secrecy.workspace = true
serde.workspace = true
sha1 = "0.10.6"
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
totp-lite.workspace = true
tracing-journald.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
# lazy_static is optional and enabled via the `mock-keyring` feature
lazy_static = {version = "1.5", optional = true}

# Network interruption detection dependencies
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls"]}
url = "2.5"
zbus = "4.0"

[dev-dependencies]
cargo-tarpaulin = "0.27"
criterion = "0.5"
hex = "0.4"
lazy_static = "1.5"
serde_json = "1.0"
tempfile = "3.0"
tokio-test = "0.4"
wiremock = "0.6"
