[workspace]
members = ["akon-core"]
resolver = "2"

[package]
name = "akon"
version = "2.1.1"
edition = "2021"
authors = ["vcwild"]
description = "A native, dependency-free CLI tool for managing F5 BIG-IP SSL VPN connections"
license = "MIT"
repository = "https://github.com/vcwild/akon"
homepage = "https://github.com/vcwild/akon"
readme = "README.md"
keywords = ["vpn", "f5", "bigip", "cli", "networking"]
categories = ["command-line-utilities", "network-programming"]

[lints.rust]
dead_code = "deny"

# Debian package metadata for cargo-deb
[package.metadata.deb]
maintainer = "vcwild"
copyright = "2025, vcwild"
license-file = ["LICENSE", "4"]
extended-description = """\
akon is a native, in-process command-line F5 BIG-IP SSL VPN client (pure Rust,
no openconnect). It connects, configures the tunnel via netlink, and supports
automatic reconnection and health checks. It runs as the user; only TUN/route
setup needs CAP_NET_ADMIN (granted via `setcap cap_net_admin+ep`)."""
section = "net"
priority = "optional"
# setcap (from libcap2-bin) is required by the post-install script to grant
# CAP_NET_ADMIN; without it akon cannot create the TUN device.
depends = "libcap2-bin"
assets = [
    ["target/release/akon", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/akon/", "644"],
    ["LICENSE", "usr/share/doc/akon/", "644"],
    ["packaging/polkit/49-akon-resolved-dns.rules", "usr/share/polkit-1/rules.d/", "644"],
]
maintainer-scripts = "debian/"

# RPM package metadata for cargo-generate-rpm
[package.metadata.generate-rpm]
# setcap (from libcap) is required by the post-install script to grant
# CAP_NET_ADMIN; without it akon cannot create the TUN device.
requires = { libcap = "*" }
assets = [
    { source = "target/release/akon", dest = "/usr/bin/akon", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/akon/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/akon/LICENSE", mode = "644" },
    { source = "packaging/polkit/49-akon-resolved-dns.rules", dest = "/usr/share/polkit-1/rules.d/49-akon-resolved-dns.rules", mode = "644" },
]
post_install_script = "rpm/post-install.sh"
pre_uninstall_script = "rpm/pre-uninstall.sh"
post_uninstall_script = "rpm/post-uninstall.sh"

[[bin]]
name = "akon"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
clap.workspace = true
tracing.workspace = true
tracing-journald.workspace = true
nix.workspace = true
serde_json.workspace = true
libc.workspace = true
serde.workspace = true
tokio.workspace = true
# Additional dependencies
chrono = "0.4"
colored = "2.1"
# Local crate
akon-core = { path = "akon-core" }

[workspace.dependencies]
# Core dependencies shared across crates
secrecy = "0.8"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# CLI and logging
clap = { version = "4.0", features = ["derive"] }
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = "0.3"
tokio = { version = "1.35", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync", "signal", "full"] }

# Security and crypto
totp-lite = "2.0"
base32 = "0.4"
keyring = { version = "3.6", features = ["sync-secret-service"] }

nix = { version = "0.27", features = ["signal", "process", "user"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
cargo-tarpaulin = "0.27"
tempfile = "3.0"
lazy_static = "1.5"

# Profile optimizations for faster builds and better caching
[profile.dev]
# Enable incremental compilation for faster rebuilds
incremental = true
# Split debuginfo to separate files for better caching
split-debuginfo = "unpacked"

[profile.test]
# Inherit from dev profile for consistency
inherits = "dev"
# Enable incremental compilation for tests
incremental = true

[profile.release]
# Optimize for performance in release builds
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

